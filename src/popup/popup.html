<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura — локальный ИИ</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="aura-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Aura</span>
      <span class="brand-tag">локальный ИИ</span>
    </div>
    <div class="header-right">
      <span id="status-dot" class="status-dot" title="Проверка Ollama"></span>
      <span id="status-text" class="status-text">…</span>
      <button id="btn-settings" class="icon-btn" title="Настройки" type="button">⚙</button>
    </div>
  </header>

  <div class="view-tabs">
    <button class="view-tab active" data-view="chat" type="button">Чат</button>
    <button class="view-tab" data-view="tabs" type="button">Вкладки</button>
    <button class="view-tab" data-view="settings" type="button">Настройки</button>
  </div>

  <!-- Чат -->
  <main id="view-chat" class="view">
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="activity-log" class="activity-log"></div>
    <div class="input-row">
      <textarea id="input" rows="1" maxlength="800" placeholder="Спросите ИИ… например: «Найди в интернете о смелости» или «Заполни форму»"></textarea>
      <button id="btn-abort" class="btn btn-warn" type="button" title="Остановить" style="display:none">■</button>
      <button id="btn-send" class="btn btn-primary" type="button" title="Отправить (Enter)">→</button>
    </div>
    <div class="chips">
      <button class="chip" data-q="Прочитай эту страницу" type="button">Прочитать страницу</button>
      <button class="chip" data-q="Заполни форму на странице" type="button">Заполнить форму</button>
      <button class="chip" data-q="Найди в интернете и расскажи" type="button">Найти в интернете</button>
    </div>
  </main>

  <!-- Вкладки -->
  <main id="view-tabs" class="view hidden">
    <div class="field-group">
      <label class="field-label">
        <span>Поиск по открытым вкладкам</span>
        <div class="input-row">
          <input id="tab-search" type="text" placeholder="что нашли на страницах?">
          <button id="btn-tab-search" class="btn btn-primary" type="button">Найти</button>
        </div>
      </label>
    </div>
    <div id="tab-results" class="tab-results"></div>
    <div class="field-group">
      <label class="field-label">
        <span>Открыть новую вкладку</span>
        <div class="input-row">
          <input id="tab-url" type="text" placeholder="https://…">
          <button id="btn-tab-new" class="btn" type="button">Открыть</button>
        </div>
      </label>
    </div>
    <button id="btn-tab-close" class="btn btn-warn" type="button">Закрыть эту вкладку</button>
  </main>

  <!-- Настройки -->
  <main id="view-settings" class="view hidden">
    <section class="settings-section">
      <h3>Ollama</h3>
      <label class="field-label"><span>Адрес сервера</span><input id="set-url" type="text"></label>
      <label class="field-label"><span>Модель</span><input id="set-model" type="text" placeholder="qwen2.5:3b"></label>
      <label class="field-label"><span>Поисковый движок</span>
        <select id="set-engine"><option value="yandex">Яндекс</option><option value="google">Google</option></select>
      </label>
      <label class="check-row"><input id="set-autofill" type="checkbox"><span>Автозаполнение форм из профиля</span></label>
      <div class="row-btns">
        <button id="btn-save-settings" class="btn btn-primary" type="button">Сохранить</button>
        <button id="btn-check" class="btn" type="button">Проверить</button>
      </div>
      <div id="check-result" class="check-result"></div>
    </section>
    <section class="settings-section">
      <h3>Профиль для автозаполнения</h3>
      <label class="field-label"><span>Имя</span><input id="p-name" type="text"></label>
      <div class="grid-2">
        <label class="field-label"><span>Имя*</span><input id="p-first" type="text"></label>
        <label class="field-label"><span>Фамилия*</span><input id="p-last" type="text"></label>
      </div>
      <label class="field-label"><span>Телефон</span><input id="p-phone" type="text" placeholder="+7 900 000-00-00"></label>
      <label class="field-label"><span>Email</span><input id="p-email" type="email"></label>
      <div class="grid-2">
        <label class="field-label"><span>Город</span><input id="p-city" type="text"></label>
        <label class="field-label"><span>Возраст</span><input id="p-age" type="number" min="0" max="120"></label>
      </div>
      <label class="field-label"><span>Адрес</span><input id="p-address" type="text"></label>
      <label class="field-label"><span>Дата рождения</span><input id="p-birth" type="date"></label>
      <label class="field-label"><span>Сайт</span><input id="p-website" type="url" placeholder="https://"></label>
      <label class="field-label"><span>Должность</span><input id="p-occupation" type="text"></label>
      <label class="field-label"><span>О себе (коротко)</span><textarea id="p-about" rows="2"></textarea></label>
      <button id="btn-save-profile" class="btn btn-primary" type="button">Сохранить профиль</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
